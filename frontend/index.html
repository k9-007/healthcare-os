<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthcareOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #090e1a; }
      html.light { background: #f2f5fa; }
    </style>
    <script>
      /* Apply the saved theme before first paint to avoid a flash. */
      try {
        var saved = JSON.parse(localStorage.getItem('healthcareos-ui'))
        if (saved && saved.state && saved.state.theme === 'light') {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
